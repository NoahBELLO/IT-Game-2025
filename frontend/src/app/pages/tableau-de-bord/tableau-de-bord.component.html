<div class="dashboard-container">
    <div class="controls">
        <div class="combo-box" id="visualisation">
            <label class="nomLabel" for="viewSelector">Vue :</label>
            <select id="viewSelector" [(ngModel)]="selectedView">
                <option *ngFor="let view of views" [value]="view.value">{{ view.label }}</option>
            </select>
        </div>

        <div class="combo-box" id="donnees">
            <label class="nomLabel" for="dataSelector">Données :</label>
            <select id="dataSelector" [(ngModel)]="selectedData">
                <option *ngFor="let data of dataSources" [value]="data.value">{{ data.label }}</option>
            </select>
        </div>
    </div>

    <div class="view-container">
        <app-graphique *ngIf="selectedView === 'chart'" [data]="chartData"></app-graphique>
        <app-carte *ngIf="selectedView === 'map'" [data]="mapData"></app-carte>
        <app-tableau *ngIf="selectedView === 'table'" [data]="tableData"></app-tableau>
        <app-resume *ngIf="selectedView === 'summary'" [data]="summaryData"></app-resume>
    </div>
</div>
